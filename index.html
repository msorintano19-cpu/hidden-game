<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Cellulare di Luca</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="start">
  <button id="openPhone">📱 Apri il cellulare di Luca</button>
</div>

<div id="phone" class="hidden">
  <div class="mockup">

    <!-- STATUS BAR -->
    <div class="statusbar">
      <span id="clock">09:41</span>
      <span>📶</span>
      <span>🔋 100%</span>
    </div>

    <!-- HOME SCREEN -->
    <div id="home" class="screen">
      <div class="app" onclick="openApp('whatsapp')">
        <div class="icon whatsapp-icon" data-symbol="📱"></div><span>WhatsApp</span>
      </div>
      <div class="app" onclick="openApp('mail')">
        <div class="icon mail-icon" data-symbol="✉️"></div><span>Mail</span>
      </div>
      <div class="app" onclick="openApp('safari')">
        <div class="icon safari-icon" data-symbol="🌐"></div><span>Safari</span>
      </div>
      <div class="app">
        <div class="icon memo-icon" data-symbol="📝"></div><span>Memo</span>
      </div>
      <div class="app">
        <div class="icon instagram-icon" data-symbol="📸"></div><span>Instagram</span>
      </div>
      <div class="app">
        <div class="icon facebook-icon" data-symbol="f"></div><span>Facebook</span>
      </div>
      <div class="app">
        <div class="icon spotify-icon" data-symbol="🎵"></div><span>Spotify</span>
      </div>
      <div class="app">
        <div class="icon map-icon" data-symbol="🗺️"></div><span>Mappe</span>
      </div>
      <div class="app">
        <div class="icon clock-icon" data-symbol="⏰"></div><span>Orologio</span>
      </div>
      <div class="app">
        <div class="icon settings-icon" data-symbol="⚙️"></div><span>Impostazioni</span>
      </div>
      <div class="app">
        <div class="icon appstore-icon" data-symbol="⬆️"></div><span>App Store</span>
      </div>
    </div>

    <!-- APP VIEW -->
    <div id="appView" class="screen hidden appTransition">
      <div class="appHeader">
        <button onclick="goBack()">⬅︎</button>
        <span id="appTitle"></span>
      </div>
      <div id="appContent"></div>
    </div>

    <!-- HOME BAR -->
    <div class="homebar"></div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
