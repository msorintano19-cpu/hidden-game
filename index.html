<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mockup iPhone Interattivo</title>
<style>
  body {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    background-color: #ffd93b; /* colore sfondo simile alla tua immagine */
    font-family: Arial, sans-serif;
  }

  .iphone {
    width: 360px;
    height: 720px;
    border: 16px solid #000;
    border-radius: 40px;
    background: #fff;
    position: relative;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* Capsula altoparlante e fotocamera */
  .top-bar {
    height: 30px;
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .top-bar::before {
    content: '';
    width: 60px;
    height: 5px;
    background: #333;
    border-radius: 3px;
  }

  /* Schermo */
  .screen {
    flex: 1;
    background: linear-gradient(180deg, #ff9d6e, #ff6b6b); /* colore di sfondo gradiente */
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-auto-rows: 80px;
    gap: 10px;
    padding: 20px 10px;
    justify-items: center;
    align-items: center;
  }

  .app {
    width: 60px;
    height: 60px;
    background: #fff;
    border-radius: 15px;
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    font-size: 24px;
    user-select: none;
    transition: transform 0.2s;
    box-shadow: 0 2px 6px rgba(0,0,0,0.2);
  }

  .app:hover {
    transform: scale(1.1);
  }

  /* Dock */
  .dock {
    display: flex;
    justify-content: space-around;
    padding: 10px 0;
    background: rgba(255,255,255,0.2);
    border-top: 1px solid rgba(0,0,0,0.1);
  }

  /* Popup App */
  .popup {
    position: absolute;
    top: 50px;
    left: 20px;
    right: 20px;
    bottom: 50px;
    background: white;
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    display: none;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 10;
  }

  .popup h2 {
    margin-bottom: 20px;
  }

  .close-btn {
    padding: 10px 20px;
    background: #333;
    color: white;
    border: none;
    border-radius: 10px;
    cursor: pointer;
  }
</style>
</head>
<body>

<div class="iphone">
  <div class="top-bar"></div>
  <div class="screen">
    <div class="app" data-app="Mail">📧</div>
    <div class="app" data-app="Calendar">📅</div>
    <div class="app" data-app="Photos">🖼️</div>
    <div class="app" data-app="Camera">📷</div>

    <div class="app" data-app="Maps">🗺️</div>
    <div class="app" data-app="Clock">⏰</div>
    <div class="app" data-app="Weather">☀️</div>
    <div class="app" data-app="News">📰</div>

    <div class="app" data-app="Home">🏠</div>
    <div class="app" data-app="Notes">📝</div>
    <div class="app" data-app="Stocks">📈</div>
    <div class="app" data-app="Wallet">💳</div>

    <div class="app" data-app="WhatsApp">💬</div>
    <div class="app" data-app="AppStore">🛍️</div>
    <div class="app" data-app="Health">❤️</div>
    <div class="app" data-app="Settings">⚙️</div>
  </div>

  <div class="dock">
    <div class="app" data-app="Facebook">📘</div>
    <div class="app" data-app="Instagram">📸</div>
    <div class="app" data-app="Messages">💚</div>
    <div class="app" data-app="Messenger">💙</div>
  </div>

  <!-- Popup App -->
  <div class="popup" id="popup">
    <h2 id="app-title">App</h2>
    <button class="close-btn" onclick="closeApp()">Chiudi</button>
  </div>
</div>

<script>
  const apps = document.querySelectorAll('.app');
  const popup = document.getElementById('popup');
  const appTitle = document.getElementById('app-title');

  apps.forEach(app => {
    app.addEventListener('click', () => {
      const appName = app.getAttribute('data-app');
      appTitle.textContent = appName;
      popup.style.display = 'flex';
    });
  });

  function closeApp() {
    popup.style.display = 'none';
  }
</script>

</body>
</html>
