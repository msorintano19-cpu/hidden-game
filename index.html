<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Hidden Game – Protocollo Zero</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- START -->
<div id="start">
  <button id="openPhone">📱 Apri il cellulare di Luca</button>
</div>

<!-- TELEFONO IPHONE -->
<div id="phone" class="hidden">
  <div class="iphone">

    <!-- BORDO SUPERIORE + STATUS BAR -->
    <div class="statusbar">
      <span>09:41</span>
      <span>📶</span>
      <span>🔋 100%</span>
    </div>

    <!-- SCHERMO IPHONE -->
    <div id="home" class="screen">
      <!-- RIGA 1 -->
      <div class="app" onclick="openApp('whatsapp')">
        🟢<span>WhatsApp</span>
      </div>
      <div class="app" onclick="openApp('email')">
        📧<span>Email</span>
      </div>
      <div class="app" onclick="openApp('google')">
        🌐<span>Google</span>
      </div>
      <div class="app" onclick="openApp('memo')">
        📝<span>Memo</span>
      </div>
    </div>

    <!-- SCHERMATA APP -->
    <div id="appView" class="screen hidden">
      <div class="appHeader">
        <button onclick="goBack()">⬅︎</button>
        <span id="appTitle"></span>
      </div>
      <div id="appContent"></div>
    </div>

    <!-- BORDO INFERIORE IPHONE (HOME BAR) -->
    <div class="homebar"></div>

  </div>
</div>

<script src="script.js"></script>
</body>
</html>
